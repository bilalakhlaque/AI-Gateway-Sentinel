kind = "web"
previewPath = "/"
title = "SentinAI"
version = "1.0.0"
id = "artifacts/sentinai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19874

[services.development]
run = "pnpm --filter @workspace/sentinai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sentinai", "run", "build" ]
publicDir = "artifacts/sentinai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19874"
BASE_PATH = "/"
